name: sellline

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: sellline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sellline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sellline}
      POSTGRES_DB: ${POSTGRES_DB:-sellline}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sellline} -d ${POSTGRES_DB:-sellline}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sellline-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: sellline-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: ['dev', 'default']

  mailhog:
    image: mailhog/mailhog:latest
    container_name: sellline-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    profiles: ['dev', 'default']

volumes:
  pgdata:
  redisdata:
  miniodata:
